openapi: 3.1.0
info:
  title: Pattystack local API
  version: 0.1.0
servers:
  - url: http://127.0.0.1:3210
components:
  securitySchemes:
    PattyKey:
      type: http
      scheme: bearer
  parameters:
    AccountId: { name: id, in: path, required: true, schema: { type: string } }
    LeaseId: { name: id, in: path, required: true, schema: { type: string } }
    RunId: { name: id, in: path, required: true, schema: { type: string } }
    ThreadId: { name: id, in: path, required: true, schema: { type: string } }
    KeyId: { name: id, in: path, required: true, schema: { type: string } }
    ApprovalId: { name: approval_id, in: path, required: true, schema: { type: string } }
  schemas:
    KeyLimits:
      type: object
      properties:
        rpm: { type: integer, minimum: 1, nullable: true, description: 'Requests started per rolling minute; null or absent is unlimited' }
        concurrency: { type: integer, minimum: 1, nullable: true, description: 'Runs in flight at once; a slot is held until the run settles, not until the response is sent' }
    Run:
      type: object
      required: [model, input]
      properties:
        model: { type: string }
        input: { type: string }
        capabilities: { type: array, items: { type: string } }
        accountId: { type: string }
        threadId: { type: string }
        idempotencyKey: { type: string }
        chat:
          type: object
          description: 'Structured turn. Offering tools here routes the run to a sub whose provider honours them, or fails with model_unavailable if none can; the resulting calls arrive on the event stream as a tool_calls event and are never persisted.'
          properties:
            messages: { type: array, items: { type: object } }
            tools: { type: array, items: { type: object, required: [type, function], properties: { type: { type: string, enum: [function] }, function: { type: object, required: [name], properties: { name: { type: string }, description: { type: string }, parameters: { type: object } } } } } }
            toolChoice: {}
        responseFormat: { $ref: '#/components/schemas/ResponseFormat' }
        instructions: { type: string, description: 'The turn''s rules, kept apart from input. Sent to a Codex sub as the thread''s developerInstructions, and to an OpenAI-compatible sub as a system message.' }
        reasoningEffort: { type: string, description: 'Whatever effort the model advertises, e.g. minimal, low, medium, high. Sent to a Codex sub as the turn effort and to an OpenAI-compatible sub as reasoning_effort.' }
        sampling: { $ref: '#/components/schemas/Sampling' }
    Sampling:
      type: object
      description: 'Decoding knobs, forwarded to a sub whose provider accepts them and ignored by one that does not (a Codex subscription turn has no temperature). An out-of-range value is 400 invalid_request.'
      properties:
        temperature: { type: number, minimum: 0, maximum: 2 }
        topP: { type: number, minimum: 0, maximum: 1 }
        maxOutputTokens: { type: integer, minimum: 1 }
        stop: { type: array, maxItems: 4, items: { type: string } }
        seed: { type: integer }
    ResponseFormat:
      description: 'Constrains the final message. json_schema is passed to the provider as the turn output schema, so the answer is the caller''s JSON rather than prose; json_object asks only for a JSON object. A malformed value is 400 invalid_request rather than a silently dropped schema.'
      oneOf:
        - type: object
          required: [type]
          properties: { type: { type: string, enum: [text, json_object] } }
        - type: object
          required: [type, json_schema]
          properties:
            type: { type: string, enum: [json_schema] }
            json_schema:
              type: object
              required: [schema]
              properties:
                name: { type: string }
                description: { type: string }
                strict: { type: boolean }
                schema: { type: object, additionalProperties: true }
    ToolCall:
      type: object
      required: [id, type, function]
      properties:
        id: { type: string }
        type: { type: string, enum: [function] }
        function:
          type: object
          required: [name, arguments]
          properties:
            name: { type: string }
            arguments: { type: string, description: 'JSON text as the provider emitted it' }
    ChatCompletion:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        stream: { type: boolean, default: false }
        messages:
          type: array
          items:
            type: object
            required: [role]
            properties:
              role: { type: string, enum: [system, developer, user, assistant, tool] }
              tool_call_id: { type: string, description: 'On a tool message, the call it answers' }
              tool_calls:
                type: array
                description: 'On an assistant message being replayed, the calls it made'
                items: { $ref: '#/components/schemas/ToolCall' }
              content:
                nullable: true
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        type: { type: string }
                        text: { type: string }
        tools:
          type: array
          description: 'Functions the model may call. Only subs whose provider supports tool calling are eligible for such a request; if none serves the model, the response is 400 model_unavailable. A Codex subscription serves them through Patty''s tool bridge: the turn is parked on the call and resumed when the caller sends a tool message carrying the tool_call_id, which reports the same run id.'
          items:
            type: object
            required: [type, function]
            properties:
              type: { type: string, enum: [function] }
              function:
                type: object
                required: [name]
                properties:
                  name: { type: string }
                  description: { type: string }
                  parameters: { type: object, additionalProperties: true }
                  strict: { type: boolean }
        tool_choice:
          description: Passed through to the provider unchanged
          oneOf:
            - { type: string, enum: [none, auto, required] }
            - type: object
              properties:
                type: { type: string, enum: [function] }
                function: { type: object, properties: {name: {type: string}} }
        response_format: { $ref: '#/components/schemas/ResponseFormat' }
        reasoning_effort: { type: string, description: 'Mapped onto the Codex turn effort, or forwarded as reasoning_effort to an OpenAI-compatible sub' }
        temperature: { type: number, minimum: 0, maximum: 2 }
        top_p: { type: number, minimum: 0, maximum: 1 }
        max_tokens: { type: integer, minimum: 1 }
        max_completion_tokens: { type: integer, minimum: 1, description: 'Preferred over max_tokens when both are sent' }
        stop:
          oneOf:
            - { type: string }
            - { type: array, maxItems: 4, items: { type: string } }
        seed: { type: integer }
paths:
  /healthz: { get: { responses: {'200': {description: Liveness}} } }
  /: { get: { responses: {'200': {description: Loopback operator console (HTML)}} } }
  /v1/usage: { get: { security: [{PattyKey: []}], responses: {'200': {description: 'Token usage totals, per-sub and per-key aggregates, and recent measured runs. Each carries cacheHitRate, the cached share of provider-reported input tokens, which is null until input tokens have been measured rather than 0. Each also carries a cost block estimated from a local price table (override with PATTY_PRICES): subscriptionUsd is what primary subs absorbed at API list price, apiUsd is real fallback spend, and a model with no price is counted in unpricedRuns rather than as zero.'}} } }
  /v1/models: { get: { security: [{PattyKey: []}], responses: {'200': {description: 'Models in OpenAI list shape; each entry names the subs that serve it. An aliased name is listed too, with aliasOf naming the model that actually answers it.'}} } }
  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completion, routed across stacked subs
      description: Set OPENAI_BASE_URL to http://127.0.0.1:3210/v1 and any OpenAI client works. The x-patty-sub response header names the sub that served the request.
      security: [{PattyKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ChatCompletion'}}}}
      responses:
        '200': {description: 'chat.completion, or a chat.completion.chunk SSE stream when stream is true. A turn that calls tools has finish_reason tool_calls, null content and a tool_calls array; tool calls are never persisted, so they appear only on the live response. A reasoning sub''s thinking arrives as delta.reasoning_content chunks while streaming, and as message.reasoning_content when not; like the answer it is never persisted, and PATTY_FORWARD_REASONING=0 omits it.'}
        '400': {description: 'Invalid request, including a malformed response_format or an out-of-range sampling knob, or model_unavailable when tools were offered and no stacked sub serving that model supports them'}
        '502': {description: Upstream run failed or was cancelled}
        '503': {description: 'no_eligible_account: every eligible sub is busy, cooling down or out of quota. Retryable, with Retry-After.'}
  /v1/responses:
    post:
      summary: OpenAI Responses API over the same stacked subs
      description: 'The request and answer shapes a current OpenAI or AI SDK client defaults to, translated onto the same chat turn: instructions become the turn''s rules, function_call/function_call_output items carry a tool round trip, text.format is response_format, reasoning.effort is reasoning_effort, max_output_tokens is max_completion_tokens. Only function tools are accepted; a hosted tool is refused rather than dropped.'
      security: [{PattyKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: {type: string, description: 'Resolved through PATTY_MODEL_ALIASES when no stacked sub serves it'}
                input: {description: 'A string, or a list of message / function_call / function_call_output items', oneOf: [{type: string}, {type: array, items: {type: object}}]}
                instructions: {type: string}
                stream: {type: boolean}
                tools: {type: array, items: {type: object, required: [type], properties: {type: {type: string, enum: [function]}, name: {type: string}, description: {type: string}, parameters: {type: object}}}}
                tool_choice: {}
                text: {type: object, properties: {format: {type: object, properties: {type: {type: string, enum: [text, json_object, json_schema]}, name: {type: string}, schema: {type: object}, strict: {type: boolean}}}}}
                reasoning: {type: object, properties: {effort: {type: string}}}
                max_output_tokens: {type: integer, minimum: 1}
                temperature: {type: number, minimum: 0, maximum: 2}
                top_p: {type: number, minimum: 0, maximum: 1}
                seed: {type: integer}
      responses:
        '200': {description: 'A response object whose output is a list of items (an output_text message, plus a function_call item per call), with usage in Responses names. With stream true, the named SSE events response.created, response.in_progress, response.output_item.added, response.content_part.added, response.reasoning_summary_text.delta when the sub reasons, response.output_text.delta, response.output_text.done, response.content_part.done, response.output_item.done and response.completed (or response.failed).'}
        '400': {description: 'Invalid request, including a hosted tool or a malformed text.format, or model_unavailable when tools were offered and no stacked sub serving that model supports them'}
        '502': {description: Upstream run failed or was cancelled}
        '503': {description: 'no_eligible_account: every eligible sub is busy, cooling down or out of quota. Retryable, with Retry-After.'}
  /v1/router/status: { get: { security: [{PattyKey: []}], responses: {'200': {description: Router status}} } }
  /v1/api-keys:
    get: { security: [{PattyKey: []}], responses: {'200': {description: 'Issued keys with name, prefix, creation, last use and revocation state; never the secret'}} }
    post: { security: [{PattyKey: []}], requestBody: {required: false, content: {application/json: {schema: {allOf: [{type: object, properties: {name: {type: string, description: 'Human label, e.g. puffle-prod'}}}, {$ref: '#/components/schemas/KeyLimits'}]}}}}, responses: {'201': {description: 'Issued key; the secret is returned once and never again'}} }
  /v1/api-keys/{id}: { delete: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/KeyId'}], responses: {'204': {description: Revoked}} } }
  /v1/api-keys/{id}/limits:
    put:
      security: [{PattyKey: []}]
      parameters: [{$ref: '#/components/parameters/KeyId'}]
      description: 'Replaces the key policy wholesale; an omitted or null field is unlimited. A request over a limit waits in the key queue and is only answered 429 (with Retry-After) when the queue is full or the wait would exceed it.'
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/KeyLimits'}}}}
      responses:
        '200': {description: Limits in force for the key}
        '400': {description: 'Invalid limit; values must be integers of at least 1'}
  /v1/accounts: { get: { security: [{PattyKey: []}], responses: {'200': {description: Accounts}} } }
  /v1/accounts/openai-compatible: { post: { security: [{PattyKey: []}], requestBody: {required: true, content: {application/json: {schema: {type: object, required: [alias, baseUrl, apiKeyEnv], properties: {alias: {type: string}, baseUrl: {type: string, description: 'http(s) base URL of an OpenAI-compatible endpoint'}, apiKeyEnv: {type: string, description: 'Name of the environment variable holding the provider key; the secret itself is never sent or stored'}, tier: {type: string, enum: [primary, fallback], default: fallback, description: 'fallback subs are only used once every primary sub is exhausted'}}}}}}, responses: {'201': {description: Stacked sub}} } }
  /v1/accounts/codex/login: { post: { security: [{PattyKey: []}], responses: {'202': {description: Login challenge}} } }
  /v1/accounts/{id}: { delete: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/AccountId'}], responses: {'204': {description: Removed}} } }
  /v1/accounts/{id}/refresh: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/AccountId'}], responses: {'200': {description: Snapshot}} } }
  /v1/accounts/{id}/relogin: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/AccountId'}], description: 'Re-authenticates a stored sub in place, by id or alias, when its provider login was revoked', responses: {'202': {description: 'Login challenge for the existing sub'}} } }
  /v1/accounts/{id}/login/cancel: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/AccountId'}], responses: {'202': {description: Cancelled}} } }
  /v1/subscriptions/lease: { post: { security: [{PattyKey: []}], requestBody: {content: {application/json: {schema: {type: object, properties: {model: {type: string, description: 'Only lend a sub that serves this model'}, ttlSeconds: {type: integer, minimum: 30, default: 300, description: 'Capped by PATTY_LEASE_MAX_SECONDS; renew for longer work'}, holder: {type: string, description: 'Free-form label for the borrower, shown to the operator'}}}}}}, responses: {'201': {description: 'Lease metadata plus a short-lived ChatGPT access token for a stacked subscription. The refresh token never leaves Patty, the lease holds one of the sub''s run slots, and turns run under it are not metered by Patty.'}, '503': {description: 'No sub can be lent right now'}} } }
  /v1/subscriptions/leases: { get: { security: [{PattyKey: []}], responses: {'200': {description: 'Live leases, without credentials'}} } }
  /v1/subscriptions/leases/{id}: { get: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/LeaseId'}], responses: {'200': {description: Lease}} }, delete: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/LeaseId'}], responses: {'204': {description: 'Sub handed back'}} } }
  /v1/subscriptions/leases/{id}/renew: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/LeaseId'}], requestBody: {content: {application/json: {schema: {type: object, properties: {ttlSeconds: {type: integer, minimum: 30, default: 300}}}}}}, responses: {'200': {description: 'Extended lease with a freshly minted access token'}, '404': {description: 'Lease unknown or already expired'}} } }
  /v1/threads:
    post:
      summary: Open a thread pinned to one sub
      description: 'Instructions given here are the thread''s standing rules, inherited by every later turn; a turn may still carry its own, which ride along with that turn''s prompt.'
      security: [{PattyKey: []}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [model], properties: {model: {type: string}, accountId: {type: string}, instructions: {type: string}}}}}}
      responses: {'201': {description: Thread}}
  /v1/threads/{id}/turns: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/ThreadId'}], responses: {'202': {description: Turn}} } }
  /metrics: { get: { security: [{PattyKey: []}], responses: {'200': {description: 'Prometheus text exposition: sub quota, reset seconds, health, active runs, runs by status, attempts by reason, tokens per sub and per key', content: {text/plain: {schema: {type: string}}}}} } }
  /v1/doctor: { get: { security: [{PattyKey: []}], responses: {'200': {description: 'Named checks with a detail and, when failing, a hint that names the fix'}} } }
  /v1/runs: { get: { security: [{PattyKey: []}], parameters: [{name: sub, in: query, schema: {type: string}}, {name: model, in: query, schema: {type: string}}, {name: status, in: query, schema: {type: string}}, {name: keyId, in: query, schema: {type: string}}, {name: since, in: query, schema: {type: string, format: date-time}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}], responses: {'200': {description: 'Run history, newest first, with sub, key, status, attempt count and tokens'}} }, post: { security: [{PattyKey: []}], requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}, responses: {'202': {description: Run}} } }
  /v1/runs/{id}: { get: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: Run}} } }
  /v1/runs/{id}/events: { get: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'200': {description: 'SSE stream of PattyEvents: started, delta, reasoning, tool_calls, usage, approval_required and one terminal completed/failed/cancelled. delta, reasoning and tool_calls are provider content, so a replayed one carries the turn''s live in-process buffer while it lasts and a redacted marker afterwards.'}} } }
  /v1/runs/{id}/cancel: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/RunId'}], responses: {'202': {description: Cancel}} } }
  /v1/runs/{id}/tool-results:
    post:
      summary: Answer the tool calls a run is parked on, resuming its turn
      description: 'A run that offered tools and was answered with a tool_calls event is waiting for the caller. Answering it resumes the same turn on the same sub; the run event stream continues. Only a call that this run made may be answered.'
      security: [{PattyKey: []}]
      parameters: [{$ref: '#/components/parameters/RunId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [results]
              properties:
                results:
                  type: array
                  minItems: 1
                  items: {type: object, required: [toolCallId, output], properties: {toolCallId: {type: string}, output: {type: string, description: 'What the caller''s function returned, as text'}}}
      responses:
        '202': {description: 'Accepted; the run continues on its event stream'}
        '400': {description: 'invalid_request: malformed results, or a tool call this run did not make'}
  /v1/runs/{id}/approvals/{approval_id}: { post: { security: [{PattyKey: []}], parameters: [{$ref: '#/components/parameters/RunId'}, {$ref: '#/components/parameters/ApprovalId'}], responses: {'202': {description: Approval}} } }
